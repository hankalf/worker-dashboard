services:
  - type: web
    name: worker-dashboard
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install && npx prisma generate && npm run build
    # Free plan has no preDeployCommand and builds can't reach the private
    # network, so migrations run at startup.
    # TEMPORARY: `prisma db seed` is included to bootstrap the admin login on a
    # fresh prod DB (new Render account). The seed only upserts the admin
    # (idempotent — set SEED_ADMIN_PASSWORD to control its password). Remove the
    # `npx prisma db seed &&` once the new prod has been logged into.
    startCommand: npx prisma migrate deploy && npx prisma db seed && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: worker-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: SEED_ADMIN_USERNAME
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

databases:
  - name: worker-db
    plan: free
    region: virginia
    databaseName: worker
    user: worker
