services:
  - type: web
    name: warehouse-dashboard
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    # Free plan has no preDeployCommand and builds can't reach the private
    # network, so migrations run at startup. Seed is NOT re-run on every boot
    # (the DB is already seeded); re-seeding each cold start only added latency
    # and an extra failure point. To (re)seed a fresh DB: npx prisma db seed.
    startCommand: npx prisma migrate deploy && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: warehouse-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: SEED_ADMIN_USERNAME
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

databases:
  - name: warehouse-db
    plan: free
    databaseName: warehouse
    user: warehouse
