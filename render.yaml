services:
  - type: web
    name: warehouse-dashboard
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    # Free plan has no preDeployCommand and builds can't reach the private
    # network, so migrations + idempotent seed run at startup instead.
    startCommand: npx prisma migrate deploy && npx prisma db seed && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: warehouse-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

databases:
  - name: warehouse-db
    plan: free
    databaseName: warehouse
    user: warehouse
